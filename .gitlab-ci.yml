### list of stages, starting with test, then auto_start, each relevant stage and stop
stages:
  - test
  - auto_start
  - all
  - app
  - data
  - ticket_bot
  - auto_stop

### declare image to use in all stages, using mtr azd-deploy from azure team
image: mtr.devops.telekom.de/ccoe_azure/azd-deploy

### declare private runner name to use in relevant stages (can be parameterized in a todo)
variables:
  DEFAULT_RUNNER: otc_run_docker_m

### include gitlab scanning

include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

  - template: Security/Secret-Detection.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

  - template: Security/Dependency-Scanning.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

### auth setup for each step to login and logout before and after
.auth_template: &auth
  before_script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - azd auth login --client-id $AZURE_CLIENT_ID --client-secret $AZURE_CLIENT_SECRET --tenant-id $AZURE_TENANT_ID
    - az account set --subscription $SUBSCRIPTION_ID
  after_script:
    - az logout
    - azd auth logout

### auth setup for each step to login and logout before and after
.auth_template_start: &auth_az
  before_script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az account set --subscription $SUBSCRIPTION_ID
  after_script:
    - az logout

### private runner setup (start and stop runner before each task via templates)
.runner_start_template: &runner_start
  <<: *auth_az
  image: mtr.devops.telekom.de/ccoe_azure/az-deploy
  script:
    - |-
      if [ "$DEV_ENV" == "true" ]; then
        echo "skip vm startup"
      else
        echo "start private runner"
        az vm start -g $RUNNER_RG -n $RUNNER_NAME > /dev/null
        az vm update -g ${RUNNER_RG} -n ${RUNNER_NAME} --set tags.gitlab_pipeline_${CI_PROJECT_ID}-${CI_PIPELINE_ID}=$(date +%s) > /dev/null
      fi
  allow_failure: false
  tags:
    - $DEFAULT_RUNNER

.runner_stop_template: &runner_stop
  <<: *auth_az
  image: mtr.devops.telekom.de/ccoe_azure/az-deploy
  script:
    - |-
      if [ "$DEV_ENV" == "true" ] | [ "$NO_RUNNER_STOP" == "true" ]; then
          echo "skip vm stop"
      else
          echo "deallocate private runner"
          LAST_PIPELINE_IDS=$(az vm show -n ${RUNNER_NAME} -g ${RUNNER_RG} --query "tags.keys(@)[?starts_with(@,'gitlab_pipeline_')]" --output tsv|awk -F '_' '{print $3}')
          for i in ${LAST_PIPELINE_IDS}; do 
            PROJECT_ID=$(echo "${i}"|awk -F '-' '{print $1}');
            PIPELINE_ID=$(echo "${i}"|awk -F '-' '{print $2}');
            echo "ProjectID: ${PROJECT_ID}";
            echo "PipelineID from tag: ${PIPELINE_ID}";
            echo "PipelineID from env: ${CI_PIPELINE_ID}";
            if [ "${PIPELINE_ID}" = "${CI_PIPELINE_ID}" ]; then
              echo "Removing Tag for current pipeline from runner";
              az vm update -g ${RUNNER_RG} -n ${RUNNER_NAME} --remove tags.gitlab_pipeline_${i} > /dev/null;
            else
              status_code=$(curl --write-out %{http_code} --output /dev/null --header "PRIVATE-TOKEN: ${ACCESS_TOKEN}" "https://gitlab.devops.telekom.de/api/v4/projects/${PROJECT_ID}/pipelines/${PIPELINE_ID}");
              echo "Status Code is: ${status_code}";
              if [ "${status_code}" = 200 ]; then
                PIPELINE=$(curl --header "PRIVATE-TOKEN: ${ACCESS_TOKEN}" "https://gitlab.devops.telekom.de/api/v4/projects/${PROJECT_ID}/pipelines/${PIPELINE_ID}");
                #echo "Curl result: ${PIPELINE}";
                STATUS=$(echo "${PIPELINE}"| jq ".status");
                echo "Pipeline status: ${STATUS}";
                if [ "${STATUS}" = "\"failed\"" ] || [ "${STATUS}" = "\"success\"" ] || [ "${STATUS}" = "null" ] || [ "${STATUS}" = "\"canceled\"" ]; then
                  echo "Removing Tag from Runner";
                  az vm update -g ${RUNNER_RG} -n ${RUNNER_NAME} --remove tags.gitlab_pipeline_${i} > /dev/null;
                fi
              elif [ "${status_code}" = 401 ]; then
                echo "Unauthorized: Please check token variable and/or access token.";
              elif [ "${status_code}" = 404 ]; then
                echo "No access: Please check if token has access to project with id ${PROJECT_ID}.";
              fi
            fi
          done
          echo "Checking for existing pipelines requests.";
          RUNNING_REQUEST_COUNT=$(az vm show -g ${RUNNER_RG} -n ${RUNNER_NAME} --query "tags.keys(@)[?starts_with(@,'gitlab_pipeline_')]" --output tsv | wc -l);
          echo "Current pipeline(s) running: ${RUNNING_REQUEST_COUNT}";
          if [ ${RUNNING_REQUEST_COUNT} = 0 ]; then
            az vm deallocate -g ${RUNNER_RG} -n ${RUNNER_NAME} > /dev/null;
          fi
      fi
  tags:
    - $DEFAULT_RUNNER

### all start jobs in automatic_start stage, that will trigger each relevant stage and start the vm before running the job

all_start:
  stage: auto_start
  <<: *runner_start
  allow_failure: false
  when: manual

app_start:
  stage: auto_start
  <<: *runner_start
  allow_failure: false
  when: manual

data_start:
  stage: auto_start
  <<: *runner_start
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SECHEDULED_TASK == "DataLoad"
    - if: '$CI_PIPELINE_SOURCE != "trigger"'
      when: manual

ticket_bot_start:
  stage: auto_start
  <<: *runner_start
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SECHEDULED_TASK == "ticket_bot" && $JIRA_SERVER
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE != "schedule" && $JIRA_SERVER
      allow_failure: false
      when: manual

### execution of the tasks in their own stage to be able to extend it in case needed
### they each will only run after specified start job in automatic_start

all_task:
  stage: all
  needs:
    - all_start
  <<: *auth
  script:
    - bash ./deploy/setup_env.sh
    - azd up
    - azd env get-values
    - bash ./deploy/set_env.sh
  artifacts:
    paths:
      - .ENVIRONMENT
  tags:
    - $RUNNER_TAG

app_task:
  stage: app
  needs:
    - app_start
  <<: *auth
  script:
    - bash ./deploy/setup_env.sh
    - azd deploy
  tags:
    - $RUNNER_TAG

data_task:
  stage: data
  image: mtr.devops.telekom.de/ccoe_azure/azd-data-deploy-v2
  needs:
    - data_start
  <<: *auth
  script:
    - bash ./deploy/setup_env.sh
    - bash ./deploy/setup_data.sh
  tags:
    - $RUNNER_TAG

ticket_bot_task:
  stage: ticket_bot
  image: mtr.devops.telekom.de/ccoe_azure/azd-jira
  needs:
    - ticket_bot_start
  <<: *auth
  script:
    - bash ./deploy/setup_env.sh
    - . $ENVIRONMENT
    - cd app/ticket-bot
    - python main.py
  tags:
    - $RUNNER_TAG
  rules:
    - if: $JIRA_SERVER

### all stop jobs in automatic_stop stage, that will trigger after each relevant stage and stop the runner vm

all_terminate:
  stage: all
  <<: *runner_stop
  needs:
    - all_start
    - all_task

app_terminate:
  stage: app
  <<: *runner_stop
  needs:
    - app_start
    - app_task

data_terminate:
  stage: data
  <<: *runner_stop
  needs:
    - data_start
    - data_task

ticket_bot_terminate:
  stage: ticket_bot
  <<: *runner_stop
  needs:
    - ticket_bot_start
    - ticket_bot_task
  rules:
    - if: $JIRA_SERVER
