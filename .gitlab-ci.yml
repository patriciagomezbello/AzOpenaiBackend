stages: # List of stages for jobs, and their order of execution
  - test      
  - all
  - infrastructure
  - data

# TODO: will be replaced with own image when microsoft fixes bug (https://github.com/Azure/azure-dev/issues/2197)
image: mcr.microsoft.com/azure-dev-cli-apps:latest 

# for this include to work, either an existing test stage must be in the pipeline (is default, when no -> stages: <- is definded)
# or the stage simply needs to be added to the stages
include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

  - template: Security/Secret-Detection.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

  - template: Security/Dependency-Scanning.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"


all-job:  
  tags:
    - azure-dev01-docker
     # This job runs in the build stage, which runs first.
  stage: all
  script:
    - azd auth login --client-id $AZURE_CLIENT_ID -client-secret $AZURE_CLIENT_SECRET --tenant-id $AZURE_TENANT_ID
    - azd up
  when: manual

infrastructure-job:
  tags:
    - azure-dev01-docker  
  stage: infrastructure   
  script:
    - azd auth login --client-id $AZURE_CLIENT_ID -client-secret $AZURE_CLIENT_SECRET --tenant-id $AZURE_TENANT_ID
    - azd provision
  when: manual

data-job:
  tags:
   - azure-dev01-docker      
  stage: data  
  script:
    - azd auth login --client-id $AZURE_CLIENT_ID -client-secret $AZURE_CLIENT_SECRET --tenant-id $AZURE_TENANT_ID
    - ./scripts/prepdocs.sh
  when: manual
